<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">CoCoTANG AVIDEO 5-pin DIN output pinout</title>
  <desc id="desc">Female socket viewed from the front, looking into the connector, with the keyway at the bottom. Pin 3 is at left, 1 at right, 5 at lower left, 4 at lower right, and 2 at bottom center. Pin 1 carries luminance, Y or green with sync; pin 2 ground; pin 3 audio; pin 4 composite video, Pr or red; pin 5 chroma, Pb or blue.</desc>
  <rect width="1100" height="650" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="45" y="58" font-size="30" font-weight="700">CoCoTANG AVIDEO · 5-pin DIN (180°)</text>
    <text x="45" y="94" font-size="19" fill="#475569">Atari 800XL monitor pin assignment, with chroma on pin 5</text>
    <text x="265" y="149" text-anchor="middle" font-size="22" font-weight="700">FEMALE SOCKET · FRONT VIEW</text>
    <text x="265" y="178" text-anchor="middle" font-size="17" fill="#475569">Looking into the socket on the computer</text>
    <circle cx="265" cy="345" r="151" fill="#cbd5e1" stroke="#334155" stroke-width="5"/>
    <circle cx="265" cy="345" r="133" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <path d="M248 493 V477 H282 V493" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
    <g fill="#0f172a" stroke="#94a3b8" stroke-width="2">
      <circle cx="160" cy="345" r="19"/>
      <circle cx="370" cy="345" r="19"/>
      <circle cx="191" cy="419" r="19"/>
      <circle cx="339" cy="419" r="19"/>
      <circle cx="265" cy="450" r="19"/>
    </g>
    <g fill="#fff" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <text x="160" y="345">3</text><text x="370" y="345">1</text>
      <text x="191" y="419">5</text><text x="339" y="419">4</text>
      <text x="265" y="450">2</text>
    </g>
    <g font-size="17" fill="#334155" text-anchor="middle">
      <text x="160" y="310">Audio</text><text x="370" y="310">Y / G</text>
      <text x="159" y="465">C / Pb / B</text><text x="377" y="465">CVBS / Pr / R</text>
      <text x="265" y="526">Keyway at bottom</text>
    </g>
    <path d="M265 503 V495" stroke="#64748b" stroke-width="2"/>
    <g transform="translate(475 205)">
      <rect width="585" height="285" rx="10" fill="#fff" stroke="#cbd5e1"/>
      <path d="M0 45 H585 M0 93 H585 M0 141 H585 M0 189 H585 M0 237 H585" stroke="#cbd5e1"/>
      <rect width="585" height="45" rx="10" fill="#e2e8f0"/>
      <g font-size="18" font-weight="700">
        <text x="16" y="29">Pin</text><text x="78" y="29">CVBS / S-Video</text>
        <text x="295" y="29">YPbPr</text><text x="435" y="29">RGB (SoG)</text>
      </g>
      <g font-size="19">
        <text x="24" y="77">1</text><text x="78" y="77">Luminance (Y)</text><text x="295" y="77">Y</text><text x="435" y="77">Green + sync</text>
        <text x="24" y="125">2</text><text x="78" y="125">Ground</text><text x="295" y="125">Ground</text><text x="435" y="125">Ground</text>
        <text x="24" y="173">3</text><text x="78" y="173">Audio</text><text x="295" y="173">Audio</text><text x="435" y="173">Audio</text>
        <text x="24" y="221">4</text><text x="78" y="221">Composite (CVBS)</text><text x="295" y="221">Pr</text><text x="435" y="221">Red</text>
        <text x="24" y="269">5</text><text x="78" y="269">Chrominance (C)</text><text x="295" y="269">Pb</text><text x="435" y="269">Blue</text>
      </g>
    </g>
    <text x="475" y="528" font-size="17" fill="#475569">Video signals depend on the programmed FPGA image.</text>
    <rect x="45" y="563" width="1015" height="52" rx="8" fill="#e2e8f0"/>
    <text x="65" y="595" font-size="19" font-weight="700">Cable plug mating-face view is mirrored. Identify pins by number when wiring.</text>
  </g>
</svg>
